<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bozor — onlayn do'kon | Kompyuter, telefon, kiyim va boshqa mahsulotlar</title>
<meta name="description" content="Bozor — Uzbekistondagi onlayn do'kon. Kompyuter, telefon, kiyim, oyoq kiyim, o'yinchoq, uy texnikasi va boshqa mahsulotlarni arzon narxlarda toping.">
<meta property="og:title" content="Bozor — onlayn do'kon">
<meta property="og:description" content="Kompyuter, telefon, kiyim va yana ko'plab mahsulotlar — barchasi bitta bozorda.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%9B%8D%EF%B8%8F%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --violet-900:#3b0f6b; --violet-800:#4C1D95; --violet-700:#6D28D9; --violet-600:#7C3AED; --violet-50:#F5F1FE;
    --teal-600:#0D9488; --teal-400:#2DD4BF;
    --ink:#1B1130; --slate-900:#111827; --slate-700:#374151; --slate-500:#6B7280; --slate-400:#9CA3AF; --slate-200:#E5E7EB; --slate-100:#F3F4F6; --slate-50:#FAFAFB;
    --rose-600:#E11D48; --emerald-600:#16A34A; --amber-500:#F59E0B; --white:#fff;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--slate-50);color:var(--slate-900);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Manrope',Georgia,sans-serif;font-weight:800;letter-spacing:-0.02em;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}
  .hidden{display:none !important;}
  .brand-text{background:linear-gradient(90deg,var(--violet-700),var(--teal-600));-webkit-background-clip:text;background-clip:text;color:transparent;font-family:'Manrope',sans-serif;font-weight:800;letter-spacing:-0.02em;}
  .btn{border:none;border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;transition:transform .15s var(--ease),background .15s,box-shadow .15s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--violet-700);color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.25);}
  .btn-primary:hover{background:var(--violet-800);box-shadow:0 4px 14px rgba(109,40,217,.35);}
  .btn-dark{background:var(--slate-900);color:#fff;}
  .btn-dark:hover{background:var(--violet-700);}
  .btn-outline{background:#fff;border:1px solid var(--slate-200);color:var(--slate-700);}
  .btn-outline:hover{border-color:var(--slate-400);background:var(--slate-50);}
  .btn-danger{background:var(--rose-600);color:#fff;}
  .btn-danger:hover{background:#be123c;}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
  .input{width:100%;border:1px solid var(--slate-200);border-radius:12px;padding:10px 14px;font-size:14px;background:#fff;transition:border-color .15s,box-shadow .15s;}
  .input:focus{outline:none;border-color:var(--violet-600);box-shadow:0 0 0 3px rgba(109,40,217,.15);}
  .label{font-size:13px;font-weight:600;color:var(--slate-700);display:block;margin-bottom:6px;}
  .card{background:#fff;border:1px solid var(--slate-200);border-radius:16px;}
  .container{max-width:1100px;margin:0 auto;padding:0 20px;}
  .swatch{display:inline-block;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.08);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(12px);}to{opacity:1;transform:translateX(0);}}
  @keyframes popIn{from{opacity:0;transform:scale(.94);}to{opacity:1;transform:scale(1);}}
  ::-webkit-scrollbar{height:6px;width:6px;}
  ::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:3px;}

  /* LOGIN */
  .login-wrap{min-height:100vh;display:flex;}
  .login-left{flex:1;display:none;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--violet-800),var(--violet-700) 55%,var(--teal-600));color:#fff;padding:48px;flex-direction:column;justify-content:space-between;}
  .login-right{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;}
  .login-box{width:100%;max-width:380px;animation:fadeUp .5s var(--ease);}
  @media(min-width:800px){.login-left{display:flex;}}
  .blob{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(2px);animation:float 9s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(-14px,16px);}}
  .cat-mini{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.75);}
  .cat-mini .circle{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:20px;transition:transform .2s var(--ease),background .2s;}
  .cat-mini:hover .circle{transform:translateY(-3px);background:rgba(255,255,255,.25);}

  /* STORE HEADER */
  .store-header{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--slate-200);}
  .store-header-row{display:flex;align-items:center;gap:16px;padding:12px 20px;}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;white-space:nowrap;cursor:pointer;transition:opacity .15s;}
  .logo:hover{opacity:.8;}
  .search-wrap{position:relative;flex:1;max-width:420px;}
  .search-wrap input{background:var(--slate-100);border-radius:999px;padding:10px 14px 10px 36px;border:1px solid transparent;width:100%;transition:background .15s,box-shadow .15s;}
  .search-wrap input:focus{background:#fff;box-shadow:0 0 0 3px rgba(109,40,217,.12);}
  .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.45;}
  .icon-btn{position:relative;background:none;border:none;padding:9px;border-radius:999px;transition:background .15s,transform .15s var(--ease);}
  .icon-btn:hover{background:var(--slate-100);transform:translateY(-1px);}
  .icon-btn:active{transform:scale(.92);}
  .badge{position:absolute;top:-2px;right:-2px;background:var(--rose-600);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 0 2px #fff;animation:popIn .2s var(--ease);}
  .chips-row{display:flex;align-items:center;gap:10px;padding:0 20px 12px;}
  .chips{display:flex;gap:8px;overflow-x:auto;flex:1;}
  .chip{flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:13.5px;font-weight:600;border:1px solid var(--slate-200);background:#fff;color:var(--slate-700);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s var(--ease);}
  .chip:hover{border-color:var(--violet-600);color:var(--violet-700);}
  .chip.active{background:var(--violet-700);border-color:var(--violet-700);color:#fff;box-shadow:0 2px 8px rgba(109,40,217,.3);}
  .sort-select{flex-shrink:0;border:1px solid var(--slate-200);border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--slate-600);background:#fff;}

  .hero{border-radius:20px;padding:32px;color:#fff;background:linear-gradient(120deg,var(--violet-800),var(--violet-700) 60%,var(--teal-600));margin:24px 0;position:relative;overflow:hidden;box-shadow:0 12px 32px -8px rgba(109,40,217,.4);}
  .hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.15) 1px, transparent 0);background-size:22px 22px;opacity:.5;}
  .hero h1{margin:0 0 6px;font-size:26px;position:relative;}
  .hero p{margin:0;color:rgba(255,255,255,.85);max-width:420px;font-size:14px;position:relative;}

  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr);}}

  .pcard{background:#fff;border:1px solid var(--slate-200);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s;animation:fadeUp .4s var(--ease) backwards;}
  .pcard:hover{box-shadow:0 16px 32px -8px rgba(17,24,39,.15);transform:translateY(-4px);border-color:transparent;}
  .pcard .img{aspect-ratio:1/1;background:var(--slate-100);overflow:hidden;position:relative;cursor:pointer;}
  .pcard .img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease);}
  .pcard:hover .img img{transform:scale(1.06);}
  .heart-btn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);border:none;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.15);transition:transform .15s var(--ease);}
  .heart-btn:hover{transform:scale(1.15);}
  .heart-btn:active{transform:scale(.9);}
  .discount-badge{position:absolute;top:8px;left:8px;background:var(--rose-600);color:#fff;font-size:11px;font-weight:800;padding:3px 7px;border-radius:8px;box-shadow:0 2px 6px rgba(225,29,72,.4);}
  .pcard .body{padding:13px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .pcard .cat{font-size:11px;color:var(--slate-400);font-weight:600;display:flex;align-items:center;gap:4px;cursor:pointer;}
  .pcard .cat:hover{color:var(--violet-600);}
  .pcard .name{font-size:13.5px;font-weight:700;line-height:1.3;min-height:34px;cursor:pointer;transition:color .15s;}
  .pcard .name:hover{color:var(--violet-700);}
  .pcard .color-row{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--slate-500);}
  .rating-row{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--slate-400);}
  .stars{color:var(--amber-500);letter-spacing:1px;font-size:12px;}
  .price-row{display:flex;align-items:baseline;gap:6px;margin-top:auto;padding-top:4px;flex-wrap:wrap;}
  .pcard .price{font-weight:800;color:var(--violet-800);font-size:14px;}
  .old-price{font-size:11.5px;color:var(--slate-400);text-decoration:line-through;}
  .placeholder-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:34px;}

  /* DRAWER (cart / wishlist / orders) */
  .overlay{position:fixed;inset:0;background:rgba(17,10,35,.45);backdrop-filter:blur(2px);z-index:40;animation:fadeIn .2s var(--ease);}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:100%;max-width:390px;background:#fff;z-index:41;display:flex;flex-direction:column;box-shadow:-8px 0 32px rgba(17,10,35,.2);animation:slideInRight .25s var(--ease);}
  .drawer-head{padding:18px 20px;border-bottom:1px solid var(--slate-100);display:flex;justify-content:space-between;align-items:center;}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:14px;}
  .cart-item{display:flex;gap:10px;align-items:center;}
  .cart-item img,.cart-item .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .qty-box{display:flex;align-items:center;gap:8px;border:1px solid var(--slate-200);border-radius:10px;padding:4px 8px;}
  .qty-box button{background:none;border:none;font-size:15px;width:18px;}
  .drawer-foot{padding:18px 20px;border-top:1px solid var(--slate-100);}
  .wish-item{display:flex;gap:10px;align-items:center;}
  .wish-item img,.wish-item .ph{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;}

  .status-badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;}
  .status-Yangi{background:#EFF6FF;color:#1D4ED8;}
  .status-Yetkazilmoqda{background:#FFFBEB;color:#B45309;}
  .status-Bajarildi{background:#ECFDF5;color:#047857;}
  .status-Bekor{background:#FFF1F2;color:#BE123C;}
  .order-card{border:1px solid var(--slate-200);border-radius:14px;padding:12px 14px;}
  .order-card .oh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}

  /* ADMIN */
  .admin-wrap{min-height:100vh;display:flex;}
  .sidebar{width:64px;background:linear-gradient(180deg,var(--ink),#150c28);color:#fff;display:flex;flex-direction:column;flex-shrink:0;}
  @media(min-width:768px){.sidebar{width:230px;}}
  .sidebar-logo{height:64px;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:800;font-size:17px;border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap;overflow:hidden;}
  .sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;}
  .sidebar-btn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;border:none;background:none;color:rgba(255,255,255,.65);font-size:14px;font-weight:600;text-align:left;white-space:nowrap;overflow:hidden;transition:background .15s,color .15s,transform .15s var(--ease);}
  .sidebar-btn:active{transform:scale(.97);}
  .sidebar-btn:hover{background:rgba(255,255,255,.08);}
  .sidebar-btn.active{background:rgba(255,255,255,.12);color:#fff;}
  .sidebar-foot{padding:10px;border-top:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;gap:4px;}
  .sidebar-label{display:none;}
  @media(min-width:768px){.sidebar-label{display:inline;}}

  .admin-main{flex:1;overflow-y:auto;padding:28px 24px;max-width:1000px;margin:0 auto;width:100%;}
  .admin-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;gap:12px;flex-wrap:wrap;}
  .stat-row{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:22px;}
  @media(min-width:640px){.stat-row{grid-template-columns:repeat(3,1fr);}}
  .stat-card{background:#fff;border:1px solid var(--slate-200);border-radius:16px;padding:14px;display:flex;align-items:center;gap:12px;transition:box-shadow .2s,transform .2s var(--ease);}
  .stat-card:hover{box-shadow:0 8px 20px rgba(17,24,39,.08);transform:translateY(-2px);}
  .stat-icon{width:40px;height:40px;border-radius:12px;background:var(--violet-50);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .stat-val{font-size:20px;font-weight:800;line-height:1;}
  .stat-label{font-size:12px;color:var(--slate-400);margin-top:4px;}

  .prow{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--slate-100);}
  .prow:hover{background:var(--slate-50);}
  .prow img,.prow .ph{width:46px;height:46px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .prow .meta{flex:1;min-width:0;}
  .prow .pname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .prow .sub{display:flex;gap:12px;font-size:11.5px;color:var(--slate-400);margin-top:3px;flex-wrap:wrap;}
  .icon-sm{background:none;border:none;padding:7px;border-radius:8px;color:var(--slate-500);}
  .icon-sm:hover{background:var(--slate-100);}
  .icon-sm.danger:hover{background:#FFF1F2;color:var(--rose-600);}

  .form-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:820px){.form-grid{grid-template-columns:1.1fr .9fr;}}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .color-opt{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--slate-200);font-size:12px;font-weight:600;background:#fff;margin:0 6px 6px 0;}
  .color-opt.active{border-color:var(--violet-600);background:var(--violet-50);}
  .preview-card{max-width:230px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(17,10,35,.45);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;animation:fadeIn .2s var(--ease);}
  .modal{background:#fff;border-radius:16px;padding:22px;max-width:360px;width:100%;animation:popIn .22s var(--ease);}
  .modal-lg{max-width:420px;max-height:90vh;overflow-y:auto;}
  .modal-xl{max-width:760px;max-height:90vh;overflow-y:auto;}
  .pay-toggle{display:flex;gap:10px;margin-top:6px;}
  .pay-opt{flex:1;border:1.5px solid var(--slate-200);border-radius:12px;padding:12px;text-align:center;font-size:13.5px;font-weight:700;background:#fff;color:var(--slate-600);display:flex;flex-direction:column;align-items:center;gap:4px;}
  .pay-opt .ic{font-size:20px;}
  .pay-opt.active{border-color:var(--violet-600);background:var(--violet-50);color:var(--violet-800);}
  .order-summary-row{display:flex;justify-content:space-between;font-size:13px;color:var(--slate-500);padding:4px 0;}
  .success-circle{width:56px;height:56px;border-radius:50%;background:#ECFDF5;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px;}

  /* PRODUCT DETAIL */
  .detail-grid{display:grid;grid-template-columns:1fr;gap:20px;}
  @media(min-width:640px){.detail-grid{grid-template-columns:1fr 1.1fr;}}
  .detail-img{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--slate-100);}
  .detail-img img{width:100%;height:100%;object-fit:cover;}
  .star-picker{display:flex;gap:4px;font-size:22px;cursor:pointer;}
  .star-picker span{color:var(--slate-200);}
  .star-picker span.filled{color:var(--amber-500);}
  .review-item{border-top:1px solid var(--slate-100);padding:10px 0;}
  .sim-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}

  /* ADMIN CATEGORIES */
  .cat-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--slate-100);}
  .cat-row .em{font-size:18px;}
  .bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .bar-track{flex:1;background:var(--slate-100);border-radius:999px;height:10px;overflow:hidden;}
  .bar-fill{height:100%;background:linear-gradient(90deg,var(--violet-700),var(--teal-600));border-radius:999px;}

  .toast{position:fixed;top:18px;right:18px;z-index:100;padding:12px 16px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.15);display:flex;align-items:center;gap:8px;animation:slideInRight .25s var(--ease);}
  .toast.ok{background:#ECFDF5;color:#047857;border:1px solid #A7F3D0;}
  .toast.err{background:#FFF1F2;color:#BE123C;border:1px solid #FECDD3;}
  .empty{text-align:center;padding:60px 20px;color:var(--slate-400);}
  .tabbar{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto;}
  .tabbtn{flex-shrink:0;padding:8px 14px;border-radius:10px;border:1px solid var(--slate-200);background:#fff;font-size:13px;font-weight:700;color:var(--slate-600);}
  .tabbtn.active{background:var(--violet-700);border-color:var(--violet-700);color:#fff;}
  .sync-banner{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:12.5px;padding:10px 16px;text-align:center;line-height:1.5;}
  .sync-banner b{color:#78350F;}
  .sync-banner.ok{background:#ECFDF5;border-color:#A7F3D0;color:#065F46;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ---------------- BASE DATA ---------------- */
const BASE_CATEGORIES = [
  { id:"computers", name:"Kompyuter va noutbuk", icon:"💻", base:true },
  { id:"phones", name:"Telefonlar", icon:"📱", base:true },
  { id:"clothes", name:"Kiyim-kechak", icon:"👕", base:true },
  { id:"shoes", name:"Oyoq kiyim", icon:"👟", base:true },
  { id:"toys", name:"O'yinchoqlar", icon:"🧸", base:true },
  { id:"home", name:"Uy texnikasi", icon:"🏠", base:true },
  { id:"accessories", name:"Soat va aksessuar", icon:"⌚", base:true },
];
const COLORS = [
  { id:"black", name:"Qora", hex:"#1A1A1A" },
  { id:"white", name:"Oq", hex:"#D4D4D8" },
  { id:"red", name:"Qizil", hex:"#E11D48" },

function hasClaudeStorage(){
  return !!(window.storage && typeof window.storage.get === 'function');
}
function storageMode(){
  if (hasClaudeStorage()) return 'claude';
  if (supabaseReady) return 'supabase';
  return 'local';
}

/* generic JSON-blob storage — used for Claude storage and the local fallback
   (categories/orders/reviews use this when Supabase isn't configured, and
   wishlist always uses this since it's a personal, per-browser list) */
async function storageGet(key, shared){
  if (hasClaudeStorage()){
    try{
      const r = await window.storage.get(key, shared);
      return r && r.value ? JSON.parse(r.value) : null;
    }catch(e){ return null; }
  }
  try{
    const raw = localStorage.getItem('bozor_local_' + key);
    return raw ? JSON.parse(raw) : (memoryStore[key] || null);
  }catch(e){
    return memoryStore[key] || null;
  }
}
async function storageSet(key, value, shared){
  memoryStore[key] = value;
  if (hasClaudeStorage()){
    try{
      await window.storage.set(key, JSON.stringify(value), shared);
      return true;
    }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem('bozor_local_' + key, JSON.stringify(value)); }catch(e){}
  return true;
}

  }
  return '';
}

function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function reviewsFor(productId){ return state.reviews[productId] || []; }
function avgRating(productId){
  const list = reviewsFor(productId);
  if (!list.length) return { avg:0, count:0 };
  const avg = list.reduce((s,r)=>s+r.rating,0)/list.length;
  return { avg, count:list.length };
}
function starsStr(avg){
  const rounded = Math.round(avg);
  return '★★★★★'.slice(0,rounded).padEnd(0) + '';
}

  const { avg, count } = avgRating(productId);
  if (count===0) return `<div class="rating-row">☆☆☆☆☆ <span>Hali sharh yo'q</span></div>`;
  const full = Math.round(avg);
  const starsHtml = '★'.repeat(full) + '☆'.repeat(5-full);
  return `<div class="rating-row"><span class="stars">${starsHtml}</span><span>${avg.toFixed(1)} (${count})</span></div>`;

      showToast("Supabase bazasiga ulanishda xatolik. Jadvallar to'g'ri yaratilganini tekshiring.", 'err');

async function sha256Hex(text){
  try{
    const enc = new TextEncoder().encode(text);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    return 'plain:' + text; // very old browsers without WebCrypto — rare fallback
  }
}

function pickStar(n){
  state.detailRatingPick = n;
  document.querySelectorAll('#starPicker span').forEach(el=>{

}
async function submitReview(e){
  e.preventDefault();
  const id = state.detailProductId;
  const comment = document.getElementById('reviewComment').value.trim();
  const review = { user: state.user.name, rating: state.detailRatingPick, comment, date: Date.now() };
  if (!state.reviews[id]) state.reviews[id] = [];
  state.reviews[id].push(review);
  if (supabaseReady){
    try{ await sb.from('reviews').insert({ product_id:id, user_name:review.user, rating:review.rating, comment:review.comment }); }
    catch(e2){ showToast('Sharhni bazaga saqlashda xatolik','err'); }
  }
  await persistReviews();
  showToast('Sharhingiz uchun rahmat!');
  renderProductDetail(id);
  if (state.screen==='store') renderProductGrid();
}

function setPayment(type){
  checkoutPayment = type;
  document.getElementById('payCashBtn').classList.toggle('active', type==='cash');
  document.getElementById('payCardBtn').classList.toggle('active', type==='card');
  document.getElementById('cardFields').classList.toggle('hidden', type!=='card');

function closeCheckoutModal(){ const m = document.getElementById('checkoutModal'); if (m) m.remove(); }

async function submitCheckout(e){
  e.preventDefault();
  const name = document.getElementById('co_name').value.trim();
  const phone = document.getElementById('co_phone').value.trim();
  const address = document.getElementById('co_address').value.trim();
  if (!name || !phone || !address){ showToast('Barcha maydonlarni to\'ldiring','err'); return; }
  if (checkoutPayment==='card'){
    const num = document.getElementById('co_card_number').value.replace(/\s/g,'');
    const exp = document.getElementById('co_card_exp').value.trim();
    const cvc = document.getElementById('co_card_cvc').value.trim();
    if (num.length < 12 || !exp || cvc.length < 3){ showToast('Karta ma\'lumotlarini to\'liq kiriting','err'); return; }
  }
  const items = cartItems();
  const orderTotal = cartTotal();
  const order = {
    id: 'BZ-' + Date.now().toString().slice(-6),
    customer: state.user.name,
    buyerName: name, phone, address,
    items: items.map(i=>({productId:i.product.id, name:i.product.name, price:i.product.price, qty:i.qty})),
    total: orderTotal,
    payment: checkoutPayment,
    status: 'Yangi',
    createdAt: Date.now(),
  };
  state.orders.push(order);
  if (supabaseReady){
    try{ await sb.from('orders').insert(orderToRow(order)); }
    catch(e){ showToast('Buyurtmani bazaga saqlashda xatolik','err'); }
  }
  await persistOrders();
  showOrderSuccess(order.id, orderTotal, checkoutPayment);
  state.cart = {};
  closeAllDrawers();
  state.cartOpen = false;
}
function showOrderSuccess(orderNo, total, payment){
  closeCheckoutModal();
  const oldSuccess = document.getElementById('successModal');
  if (oldSuccess) oldSuccess.remove();
  const html = `

    <div class="modal" style="text-align:center;">

      <p style="color:var(--slate-500);font-size:13.5px;margin:0 0 16px;">Buyurtma raqami: <b style="color:var(--slate-800)">${orderNo}</b></p>
      <div class="order-summary-row" style="justify-content:center;gap:6px;font-size:13.5px;"><span>To'lov turi:</span><b>${payment==='card' ? '💳 Bank kartasi' : '💵 Naqd pul'}</b></div>

}

      </div>
      <div>
        <label class="label">Rangi</label>
        <div>${colorOpts}</div>
      </div>
      <div class="field-row">
        <div>
          <label class="label">Rasm URL manzili</label>
          <input id="f_image" class="input" placeholder="https://..." value="${esc(formDraft.image)}">
        </div>
        <div>
          <label class="label">Ombordagi soni</label>
          <input id="f_stock" type="number" min="0" class="input" placeholder="10" value="${esc(formDraft.stock)}">
        </div>
      </div>
      <div>
        <label class="label">Tavsif (ixtiyoriy)</label>
        <textarea id="f_description" class="input" rows="3" style="resize:none;" placeholder="Mahsulot haqida qisqacha...">${esc(formDraft.description)}</textarea>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="submit" class="btn btn-primary" style="flex:1;justify-content:center;">✓ ${state.editingId ? "Saqlash" : "Qo'shish"}</button>
        <button type="button" class="btn btn-outline" onclick="state.adminTab='products';render()">Bekor qilish</button>
      </div>
    </form>

    <div>
      <p style="font-size:13px;font-weight:600;color:var(--slate-500);margin-bottom:8px;">Ko'rinishi:</p>
      <div class="pcard preview-card" id="previewCard" style="border-left:5px solid ${color.hex};">
        <div class="img">${imgOrPlaceholder(formDraft.image, color.hex, findCat(formDraft.category).icon)}</div>
        <div class="body">
          <div class="cat">${findCat(formDraft.category).icon} ${findCat(formDraft.category).name}</div>
          <div class="name">${esc(formDraft.name)||'Mahsulot nomi'}</div>
          <div class="color-row"><span class="swatch" style="width:12px;height:12px;background:${color.hex};"></span>${color.name}</div>
          <div class="price-row"><span class="price">${fmtSum(formDraft.price)}</span>${formDraft.oldPrice && Number(formDraft.oldPrice)>Number(formDraft.price) ? `<span class="old-price">${fmtSum(formDraft.oldPrice)}</span>`:''}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function renderProductList(){
  const wrap = document.getElementById('productListWrap');
  if (!wrap) return;
  if (state.products.length===0){
    wrap.innerHTML = `<div class="empty" style="border:1px dashed var(--slate-200);border-radius:16px;">📦<p style="margin:8px 0;">Hozircha mahsulot yo'q</p><button class="btn btn-primary" onclick="openAddForm()">+ Birinchi mahsulotni qo'shing</button></div>`;
    return;
  }
  wrap.innerHTML = `<div class="card">` + state.products.map(p=>{
    const color = colorMap[p.color]||COLORS[0];
    const cat = findCat(p.category);
    const { avg, count } = avgRating(p.id);
    return `
    <div class="prow">
      ${p.image ? `<img src="${esc(p.image)}" onerror="this.outerHTML='<div class=&quot;ph&quot; style=&quot;background:${color.hex}33;display:flex;align-items:center;justify-content:center;&quot;>${cat.icon}</div>'">` : `<div class="ph" style="background:${color.hex}33;display:flex;align-items:center;justify-content:center;">${cat.icon}</div>`}
      <div class="meta">
        <div class="pname">${esc(p.name)}</div>
        <div class="sub">
          <span>${cat.icon} ${cat.name}</span>
          <span>🎨 ${color.name}</span>
          <span>Ombor: ${p.stock ?? 0}</span>
          <span>${count>0?`⭐ ${avg.toFixed(1)} (${count})`:'Sharh yo\'q'}</span>
        </div>
      </div>
      <div style="font-weight:800;color:var(--violet-800);font-size:13.5px;white-space:nowrap;">${fmtSum(p.price)}</div>
      <button class="icon-sm" onclick="openEditForm('${p.id}')">✏️</button>
      <button class="icon-sm danger" onclick="askDelete('${p.id}')">🗑️</button>
    </div>`;
  }).join('') + `</div>`;
}

function askDelete(id){
  state.confirmDeleteId = id;
  const p = state.products.find(x=>x.id===id);
  document.body.insertAdjacentHTML('beforeend', `
    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <div style="width:40px;height:40px;border-radius:50%;background:#FFF1F2;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:10px;">⚠️</div>
        <h3 style="margin:0 0 6px;font-size:17px;">Mahsulotni o'chirish</h3>
        <p style="color:var(--slate-500);font-size:13.5px;margin:0 0 16px;">"${esc(p?p.name:'')}" mahsulotini o'chirmoqchimisiz? Bu amalni ortga qaytarib bo'lmaydi.</p>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-danger" style="flex:1;justify-content:center;" onclick="confirmDelete()">O'chirish</button>
          <button class="btn btn-outline" style="flex:1;justify-content:center;" onclick="closeDeleteModal()">Bekor qilish</button>
        </div>
      </div>
    </div>`);
}
function closeDeleteModal(){
  const m = document.getElementById('deleteModal'); if (m) m.remove();
  state.confirmDeleteId = null;
}
async function confirmDelete(){
  const id = state.confirmDeleteId;
  if (supabaseReady){
    try{ await sb.from('products').delete().eq('id', id); }
    catch(e){ showToast("Bazadan o'chirishda xatolik",'err'); }
  }
  await persistProducts(state.products.filter(p=>p.id!==id));
  closeDeleteModal();
  renderProductList();
  showToast("Mahsulot o'chirildi");
}

async function submitProduct(e){
  e.preventDefault();
  const name = document.getElementById('f_name').value.trim();
  const category = document.getElementById('f_category').value;
  const price = Number(document.getElementById('f_price').value);
  const oldPriceRaw = document.getElementById('f_oldprice').value;
  const oldPrice = oldPriceRaw ? Number(oldPriceRaw) : null;
  const image = document.getElementById('f_image').value.trim();
  const stock = Number(document.getElementById('f_stock').value) || 0;
  const description = document.getElementById('f_description').value.trim();

  if (!name){ showToast('Mahsulot nomini kiriting','err'); return; }
  if (!price || price<=0){ showToast("To'g'ri narx kiriting",'err'); return; }

  const productObj = { id: state.editingId || ('p_'+Date.now()), name, category, price, oldPrice, color: state.selectedColor, image, stock, description };
  let next;
  if (state.editingId) next = state.products.map(p=>p.id===state.editingId?productObj:p);
  else next = [productObj, ...state.products];

  const submitBtn = e.target.querySelector('button[type=submit]');
  if (submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Saqlanmoqda...'; }
  if (supabaseReady){
    try{ await sb.from('products').upsert(productToRow(productObj)); }
    catch(e2){ showToast('Bazaga saqlashda xatolik','err'); if (submitBtn){ submitBtn.disabled=false; submitBtn.textContent = state.editingId?'Saqlash':"Qo'shish"; } return; }
  }
  await persistProducts(next);

  state.editingId = null;
  state.adminTab = 'products';
  formDraft = emptyForm();
  render();
  afterAdminRender();
  showToast("Mahsulot saqlandi");
}

/* ---- Admin Orders ---- */
function renderAdminOrders(){
  const orders = [...state.orders].sort((a,b)=>b.createdAt-a.createdAt);
  if (orders.length===0){
    return `<div class="empty" style="border:1px dashed var(--slate-200);border-radius:16px;">🧾<p style="margin-top:8px;">Hozircha buyurtmalar yo'q</p></div>`;
  }
  return `<div class="card">` + orders.map(o=>`
    <div class="prow" style="align-items:flex-start;flex-wrap:wrap;">
      <div class="meta" style="min-width:200px;">
        <div class="pname">${o.id} — ${esc(o.buyerName||o.customer)}</div>
        <div class="sub">
          <span>👤 ${esc(o.customer)}</span>
          <span>📞 ${esc(o.phone||'-')}</span>
          <span>📍 ${esc(o.address||'-')}</span>
          <span>${o.payment==='card'?'💳 Karta':'💵 Naqd'}</span>
          <span>${new Date(o.createdAt).toLocaleString('uz-UZ')}</span>
        </div>
        <div class="sub" style="margin-top:4px;">${o.items.map(it=>`${esc(it.name)} ×${it.qty}`).join(', ')}</div>
      </div>
      <div style="font-weight:800;color:var(--violet-800);font-size:13.5px;white-space:nowrap;margin-left:auto;">${fmtSum(o.total)}</div>
      <select class="input" style="width:auto;padding:6px 10px;font-size:12.5px;" onchange="updateOrderStatus('${o.id}', this.value)">
        ${ORDER_STATUSES.map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
  `).join('') + `</div>`;
}
async function updateOrderStatus(orderId, status){
  const o = state.orders.find(x=>x.id===orderId);
  if (!o) return;
  o.status = status;
  if (supabaseReady){
    try{ await sb.from('orders').update({ status }).eq('id', orderId); }
    catch(e){ showToast('Holatni bazada yangilashda xatolik','err'); }
  }
  await persistOrders();
  showToast('Holat yangilandi');
}

/* ---- Admin Stats ---- */
function renderAdminStats(){
  const activeOrders = state.orders.filter(o=>o.status!=='Bekor qilindi');
  const revenue = activeOrders.reduce((s,o)=>s+o.total,0);
  const totalOrders = state.orders.length;
  const avgOrder = totalOrders>0 ? Math.round(revenue/Math.max(activeOrders.length,1)) : 0;

  const qtyMap = {};
  state.orders.forEach(o=>o.items.forEach(it=>{ qtyMap[it.name] = (qtyMap[it.name]||0) + it.qty; }));
  const top = Object.entries(qtyMap).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxQty = top.length ? top[0][1] : 1;

  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-icon">💰</div><div><div class="stat-val">${fmtSum(revenue)}</div><div class="stat-label">Umumiy tushum</div></div></div>
      <div class="stat-card"><div class="stat-icon">🧾</div><div><div class="stat-val">${totalOrders}</div><div class="stat-label">Jami buyurtmalar</div></div></div>
      <div class="stat-card"><div class="stat-icon">📈</div><div><div class="stat-val">${fmtSum(avgOrder)}</div><div class="stat-label">O'rtacha buyurtma</div></div></div>
    </div>
    <div class="card" style="padding:18px;">
      <p style="font-weight:700;font-size:14px;margin:0 0 14px;">Eng ko'p sotilgan mahsulotlar</p>
      ${top.length===0 ? `<p style="color:var(--slate-400);font-size:13px;">Hali sotuvlar yo'q</p>` :
        top.map(([name,qty])=>`
        <div class="bar-row">
          <span style="font-size:12.5px;width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(name)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(qty/maxQty*100)}%;"></div></div>
          <span style="font-size:12px;color:var(--slate-500);width:50px;text-align:right;">${qty} dona</span>
        </div>
      `).join('')}
    </div>`;
}

/* ---- Admin Categories ---- */
function renderAdminCategories(){
  return `
  <div class="form-grid">
    <form id="categoryForm" class="card" style="padding:20px;display:flex;flex-direction:column;gap:14px;">
      <div>
        <label class="label">Kategoriya nomi</label>
        <input id="cat_name" class="input" placeholder="Masalan: Sport buyumlari">
      </div>
      <div>
        <label class="label">Emoji belgisi</label>
        <input id="cat_icon" class="input" placeholder="🏀" maxlength="4">
      </div>
      <button type="submit" class="btn btn-primary">➕ Kategoriya qo'shish</button>
    </form>
    <div class="card">
      ${state.categories.map(c=>`
        <div class="cat-row">
          <span class="em">${c.icon}</span>
          <span style="flex:1;font-size:13.5px;font-weight:600;">${c.name}</span>
          ${c.base ? `<span style="font-size:11px;color:var(--slate-400);">asosiy</span>` : `<button class="icon-sm danger" onclick="deleteCategory('${c.id}')">🗑️</button>`}
        </div>
      `).join('')}
    </div>
  </div>`;
}
async function submitCategory(e){
  e.preventDefault();
  const name = document.getElementById('cat_name').value.trim();
  const icon = document.getElementById('cat_icon').value.trim() || '📦';
  if (!name){ showToast('Kategoriya nomini kiriting','err'); return; }
  const id = name.toLowerCase().replace(/[^a-z0-9а-яёʻʼ]+/gi,'_').replace(/^_+|_+$/g,'') + '_' + Date.now().toString().slice(-4);
  state.categories.push({ id, name, icon, base:false });
  if (supabaseReady){
    try{ await sb.from('categories').upsert({ id, name, icon }); }
    catch(e2){ showToast('Bazaga saqlashda xatolik','err'); }
  }
  await persistCategories();
  showToast('Kategoriya qo\'shildi');
  render(); afterAdminRender();
}
async function deleteCategory(id){
  const inUse = state.products.some(p=>p.category===id);
  if (inUse){ showToast('Bu kategoriyada mahsulotlar bor, avval ularni o\'chiring yoki boshqa kategoriyaga o\'tkazing','err'); return; }
  state.categories = state.categories.filter(c=>c.id!==id);
  if (supabaseReady){
    try{ await sb.from('categories').delete().eq('id', id); }
    catch(e){ showToast("Bazadan o'chirishda xatolik",'err'); }
  }
  await persistCategories();
  showToast('Kategoriya o\'chirildi');
  render(); afterAdminRender();
}

function afterAdminRender(){
  if (state.adminTab==='products'){
    renderProductList();
  } else if (state.adminTab==='add'){
    const form = document.getElementById('productForm');
    if (form) form.onsubmit = submitProduct;
    ['f_name','f_category','f_price','f_oldprice','f_image','f_stock','f_description'].forEach(id=>{
      const el = document.getElementById(id);
      if (!el) return;
      const evt = (el.tagName==='SELECT') ? 'onchange' : 'oninput';
      el[evt] = ()=>{
        formDraft.name = document.getElementById('f_name').value;
        formDraft.category = document.getElementById('f_category').value;
        formDraft.price = document.getElementById('f_price').value;
        formDraft.oldPrice = document.getElementById('f_oldprice').value;
        formDraft.image = document.getElementById('f_image').value;
        formDraft.stock = document.getElementById('f_stock').value;
        formDraft.description = document.getElementById('f_description').value;
        updatePreview();
      };
    });
  } else if (state.adminTab==='categories'){
    const form = document.getElementById('categoryForm');
    if (form) form.onsubmit = submitCategory;
  }
}
function updatePreview(){
  const card = document.getElementById('previewCard');
  if (!card) return;
  const color = colorMap[state.selectedColor]||COLORS[0];
  const cat = findCat(formDraft.category);
  card.style.borderLeftColor = color.hex;
  card.querySelector('.img').innerHTML = imgOrPlaceholder(formDraft.image, color.hex, cat.icon);
  card.querySelector('.cat').textContent = cat.icon + ' ' + cat.name;
  card.querySelector('.name').textContent = formDraft.name || 'Mahsulot nomi';
  card.querySelector('.color-row').innerHTML = `<span class="swatch" style="width:12px;height:12px;background:${color.hex};"></span>${color.name}`;
  const priceRow = card.querySelector('.price-row');
  const hasDiscount = formDraft.oldPrice && Number(formDraft.oldPrice) > Number(formDraft.price);
  priceRow.innerHTML = `<span class="price">${fmtSum(formDraft.price)}</span>${hasDiscount ? `<span class="old-price">${fmtSum(formDraft.oldPrice)}</span>` : ''}`;
}

/* ---------------- GLOBAL EVENT BINDING ---------------- */
function bindGlobalEvents(){
  if (state.screen==='login'){
    const form = document.getElementById('loginForm');
    if (form) form.onsubmit = doLogin;
  } else if (state.screen==='store'){
    afterStoreRender();
  } else if (state.screen==='admin'){
    afterAdminRender();
  }
}

/* ---------------- BOOT ---------------- */
(async function init(){
  try{
    const raw = localStorage.getItem('bozor_session');
    if (raw){
      const savedUser = JSON.parse(raw);
      if (savedUser && savedUser.name){
        state.user = savedUser;
        state.screen = savedUser.role === 'admin' ? 'admin' : 'store';
      }
    }
  }catch(e){ /* no saved session */ }
  render();
  await loadAll();
  render();
  bindGlobalEvents();
})();
</script>
</body>
</html>
